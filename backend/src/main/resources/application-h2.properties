# ── H2 In-Memory Database ───────────────────────────
spring.datasource.url=jdbc:h2:mem:lms_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.sql.init.mode=never

# ── JWT ──────────────────────────────────────────
jwt.secret=${JWT_SECRET:learnhub2025SecretKeyForJWTTokenGenerationMustBe256BitsLong!}
jwt.expiration=86400000

# ── Google OAuth ─────────────────────────────────
google.client.id=${GOOGLE_CLIENT_ID:181483437903-hc2oi74307lk305r5ejj1gohcdm1v52b.apps.googleusercontent.com}

# ── Gemini AI ────────────────────────────────────
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent

# ── Grok AI (xAI) ────────────────────────────────
grok.api.key=${GROK_API_KEY:YOUR_GROK_API_KEY_HERE}
grok.api.url=https://api.x.ai/v1/chat/completions
grok.model=grok-3-mini

# ── OpenRouter AI ────────────────────────────────
openrouter.api.key=${OPENROUTER_API_KEY:YOUR_OPENROUTER_API_KEY_HERE}
openrouter.api.url=${OPENROUTER_API_URL:https://openrouter.ai/api/v1/chat/completions}
openrouter.model=${OPENROUTER_MODEL:google/gemini-2.5-flash}

# ── Cloudinary Media Storage ─────────────────────
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:YOUR_CLOUD_NAME_HERE}
cloudinary.api-key=${CLOUDINARY_API_KEY:YOUR_API_KEY_HERE}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:YOUR_API_SECRET_HERE}

# ── CORS ─────────────────────────────────────────
# Next.js local server typically runs on port 3000
frontend.url=http://localhost:3000


frontend.base.url=http://localhost:3000
