# ── Server ──────────────────────────────────────
server.port=8080
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── PostgreSQL Database ───────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lms_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── JPA / Hibernate ──────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── Flyway Migrations ────────────────────────────
spring.flyway.baseline-on-migrate=true

# ── JWT ──────────────────────────────────────────
jwt.secret=${JWT_SECRET:learnhub2025SecretKeyForJWTTokenGenerationMustBe256BitsLong!}
jwt.expiration=86400000

# ── Google OAuth ─────────────────────────────────
google.client.id=${GOOGLE_CLIENT_ID:181483437b.apps.googleusercontent.com}
google.self-link.enabled=false

# ── Gemini AI ────────────────────────────────────
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent

# ── Grok AI (xAI) ────────────────────────────────
grok.api.key=${GROK_API_KEY:YOUR_GROK_API_KEY_HERE}
grok.api.url=https://api.x.ai/v1/chat/completions
grok.model=grok-3-mini

# ── OpenRouter AI ────────────────────────────────
openrouter.api.key=${OPENROUTER_API_KEY:YOUR_OPENROUTER_API_KEY_HERE}
openrouter.api.url=${OPENROUTER_API_URL:https://openrouter.ai/api/v1/chat/completions}
openrouter.model=${OPENROUTER_MODEL:nvidia/nemotron-3-ultra-550b-a55b:free}

# ── Cloudinary Media Storage ─────────────────────
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:YOUR_CLOUD_NAME_HERE}
cloudinary.api-key=${CLOUDINARY_API_KEY:YOUR_API_KEY_HERE}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:YOUR_API_SECRET_HERE}

# ── CORS ─────────────────────────────────────────
frontend.url=http://127.0.0.1:5500
# frontend.url=http://localhost:5500

# ── Google Drive API ──────────────────────────────
google.drive.credentials.path=${GOOGLE_DRIVE_CREDENTIALS_PATH:../resources/google-credentials.json}
google.drive.root.folder.id=${GOOGLE_DRIVE_ROOT_FOLDER_ID:19658d-M_bpgCTB8oj1vU9u3eIv2pw64T}

# ── Google Cloud Storage ──────────────────────────
gcp.storage.bucket.name=${GCP_STORAGE_BUCKET_NAME:learnhub}

# ── Auto-TA AI Router & Optimization ─────────────
autota.ai.provider=
ai.provider.priority=${AI_PROVIDER_PRIORITY:gemini,openrouter,local}
openrouter.free.model=${OPENROUTER_FREE_MODEL:openrouter/free}
autota.max.retries=${AUTO_TA_MAX_RETRIES:5}
autota.enable.ai.analysis.for.simple.theory=${AUTO_TA_ENABLE_AI_ANALYSIS_FOR_SIMPLE_THEORY:false}

# ── BYOK Security ────────────────────────────────
ai.key.encryption.secret=${AI_KEY_ENCRYPTION_SECRET:LearnStudioSecureByokSecretKey!!}
